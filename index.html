<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>After-School Lessons</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="app" class="page-shell">
		<header class="site-header">
			<p class="eyebrow">After-school learning</p>
			<h1>Find a lesson that sparks curiosity.</h1>
			<p class="intro">Explore practical, creative, and future-focused courses for curious learners.</p>
		</header>

		<main>
			<section class="lesson-grid" aria-label="Available after-school lessons">
				<article v-for="lesson in lessons" :key="lesson.subject" class="lesson-card">
					<img class="lesson-image" :src="lesson.image" :alt="lesson.alt">
					<div class="lesson-content">
						<p class="lesson-category">After-school lesson</p>
						<h2>{{ lesson.subject }}</h2>
						<dl class="lesson-details">
							<div>
								<dt>Location</dt>
								<dd>{{ lesson.location }}</dd>
							</div>
							<div>
								<dt>Price</dt>
								<dd>{{ lesson.price }}</dd>
							</div>
							<div>
								<dt>Tutor</dt>
								<dd>{{ lesson.tutor }}</dd>
							</div>
						</dl>
						<button type="button">View lesson</button>
					</div>
				</article>
			</section>
		</main>
	</div>

	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script>
		Vue.createApp({
			data() {
				return {
					lessons: [
						{
							subject: 'Computer Science',
							location: 'Hendon',
							price: '17,000 ',
                            tutor: 'John Doe',
							image: 'images/computer-science.jpg',
							alt: 'A student learning computer science at a laptop'
						},
						{
							subject: 'Art',
							location: 'Wembley',
							price: '11,000',
                            tutor: 'Akira Smith',
							image: 'images/art.jpg',
							alt: 'Colourful art supplies ready for a creative lesson'
						},
						{
							subject: 'Engineering',
							location: 'Harrow',
							price: '20,000',
                            tutor: 'Emily Johnson',
							image: 'images/engineering.jpg',
							alt: 'A student building a small engineering project'
						},
						{
							subject: 'Business',
							location: 'Edgware',
							price: '17,000',
                            tutor: 'Michael Brown',
							image: 'images/business.jpg',
							alt: 'Students collaborating around a table during a business lesson'
						},
						{
							subject: 'Cybersecurity',
							location: 'Finchley',
							price: '22,000',
                            tutor: 'Sarah Davis',
							image: 'images/cybersecurity.jpg',
							alt: 'A secure digital network represented on a computer screen'
						}
					]
				};
			}
		}).mount('#app');
	</script>
</body>
</html>
